name: Build iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build iOS App (Unsigned)
        run: |
          # الانتقال لمسار بناء مشروع الآيفون أو تنفيذيّة Gradle/Xcode حسب هيكلة CMP
          # إذا كان المشروع يحتوي على سكربت تجميع مباشر أو عبر xcodebuild للمجلد الداخلي:
          cd iosApp || cd ios # حسب المجلد الموجود في مشروعك إن وجد، أو بناء مشروع Compose المخصص للآيفون
          
          # بناء ملف التطبيق غير الموقّع
          xcodebuild -workspace NuvioMobile.xcworkspace \
            -scheme NuvioMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir Payload
          # تأكد من مسار ملف .app الناتج من مجلد البناء السحابي
          cp -r iosApp/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Nuvio-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Unsigned-IPA
          path: Nuvio-Unsigned.ipa
