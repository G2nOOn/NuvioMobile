workflows:
  ios-unsigned-ipa:
    name: Build Unsigned KMP IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Initialize Git Submodules
        script: git submodule update --init --recursive
      - name: Grant gradlew permission
        script: chmod +x gradlew
      - name: Install CocoaPods
        script: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install && cd ..
          elif [ -f "ios/Podfile" ]; then
            cd ios && pod install && cd ..
          fi
      - name: Build Unsigned Archive
        script: |
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | grep -v "project.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          else
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          fi
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r NuvioMobile.ipa Payload
    artifacts:
      - NuvioMobile.ipa
