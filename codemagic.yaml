workflows:
  ios-unsigned-ipa:
    name: Build Unsigned KMP IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Initialize MPVKit Submodule
        script: git submodule update --init --recursive MPVKit
      - name: Grant gradlew permission
        script: chmod +x gradlew
      - name: Install CocoaPods
        script: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install && cd ..
          elif [ -f "ios/Podfile" ]; then
            cd ios && pod install && cd ..
          fi
      - name: Build Unsigned Archive
        script: |
          set -o pipefail
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          elif [ -d "$HOME/Library/Android/sdk" ]; then
            echo "sdk.dir=$HOME/Library/Android/sdk" > local.properties
          fi
          WORKSPACE=$(find . -maxdepth 2 -name "*.xcworkspace" | grep -v "project.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO archive | tee xcodebuild.log || {
              echo "=== EXACT KOTLIN/GRADLE ERROR ==="
              grep -B 3 -A 25 -E "FAILURE:|What went wrong:|Execution failed for task|e: file:|error:" xcodebuild.log | tail -n 60
              exit 1
            }
          else
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO archive | tee xcodebuild.log || {
              echo "=== EXACT KOTLIN/GRADLE ERROR ==="
              grep -B 3 -A 25 -E "FAILURE:|What went wrong:|Execution failed for task|e: file:|error:" xcodebuild.log | tail -n 60
              exit 1
            }
          fi
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r NuvioMobile.ipa Payload
    artifacts:
      - NuvioMobile.ipa
